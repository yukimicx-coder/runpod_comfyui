name: RunPod_test_server
services:
  remote:
    image: ghcr.io/yukimicx-coder/runpod_comfyui_ready:latest
    container_name: runpod_server
    hostname: server
    restart: unless-stopped
    working_dir: /root/comfy
    environment:
      - COMFYCLI_TAG=${COMFYCLI_TAG}
      - COMFYCLI_CUDA=${COMFYCLI_CUDA}
      - PUBLIC_KEY=${PUBLIC_KEY}
      
      # for GUI
      - "DISPLAY=:0"
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/mnt/host/wslg/runtime-dir
      - PULSE_SERVER=unix:/mnt/host/wslg/PulseServer
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
    ports:
      - "127.0.0.1:2322:22"
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      # network volume
      - type: bind
        source: ${WORKSPACE:-./workspace}
        target: /workspace

      - type: bind
        source: $COMFYUI_TAR_ROOT/ComfyUI_v${COMFYCLI_TAG}_cu${COMFYCLI_CUDA}.tar.gz
        target: /workspace/ComfyUI_v${COMFYCLI_TAG}_cu${COMFYCLI_CUDA}.tar.gz
      

      # for GUI
      - //tmp/.X11-unix:/tmp/.X11-unix
      - //mnt/wslg:/mnt/wslg
      - //usr/lib/wsl:/usr/lib/wsl
    devices:
      - //dev/dxg:/dev/dxg
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 16G
        reservations:
          memory: 6G

    networks:
      - comfy_net

    init: true

networks:
  comfy_net:
    external: true
